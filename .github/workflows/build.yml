name: Build Kadr

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04          # older glibc = the AppImage runs on more distributions
    defaults: { run: { working-directory: qt } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System libraries Qt needs (bundled into the AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libegl1 libfuse2 fonts-dejavu-core
      - run: pip install -r requirements.txt pyinstaller
      - run: python tools/make_icons.py
      - name: Self-test (draws the overlay, dialogs and notices)
        run: QT_QPA_PLATFORM=offscreen KADR_LANG=ru python -m kadr --render-test selftest
      - run: pyinstaller --noconfirm kadr.spec
      - name: Self-test of the built program
        run: QT_QPA_PLATFORM=offscreen KADR_LANG=uk dist/kadr/kadr --render-test selftest-built
      - name: AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/kadr/* AppDir/usr/bin/
          cp build/kadr.png AppDir/kadr.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/kadr" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/kadr.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Kadr
          Comment=Screenshots with upload
          Exec=kadr %F
          Icon=kadr
          Categories=Graphics;Utility;
          MimeType=image/png;image/jpeg;image/gif;image/webp;image/bmp;
          EOF
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir Kadr-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with: { name: Kadr-Linux, path: qt/Kadr-Linux-x86_64.AppImage }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: selftest-linux, path: "qt/selftest*" }

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: AppleSilicon }
          - { os: macos-15-intel, arch: Intel }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: qt } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: python tools/make_icons.py
      - name: Self-test (draws the overlay, dialogs and notices)
        run: QT_QPA_PLATFORM=offscreen KADR_LANG=ru python -m kadr --render-test selftest
      - run: pyinstaller --noconfirm kadr.spec
      - name: Self-test of the built app
        run: QT_QPA_PLATFORM=offscreen KADR_LANG=en dist/Kadr.app/Contents/MacOS/Kadr --render-test selftest-built
      - name: Disk image
        run: |
          codesign --force --deep --sign - dist/Kadr.app
          hdiutil create -volname Kadr -srcfolder dist/Kadr.app -ov -format UDZO Kadr-macOS-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with: { name: "Kadr-macOS-${{ matrix.arch }}", path: "qt/Kadr-macOS-${{ matrix.arch }}.dmg" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "selftest-macos-${{ matrix.arch }}", path: "qt/selftest*" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the C# compiler that ships with Windows
        shell: powershell
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with: { name: Kadr-Windows, path: Kadr.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, mac, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "Kadr-*", merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Kadr-Linux-x86_64.AppImage
            Kadr-macOS-*.dmg
            Kadr.exe
