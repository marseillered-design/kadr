name: Build Kadr

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # v1.2.0 tag -> 1.2.0; ordinary pushes build 1.0.0
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}

jobs:
  linux:
    runs-on: ubuntu-22.04          # older glibc = the packages run on more distributions
    defaults: { run: { working-directory: qt } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System libraries Qt needs (bundled into the packages) and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libegl1 libfuse2 fonts-dejavu-core rpm
          sudo gem install --no-document fpm
      - run: pip install -r requirements.txt pyinstaller
      - name: Self-test (draws the overlay, dialogs and notices)
        run: QT_QPA_PLATFORM=offscreen KADR_LANG=ru python -m kadr --render-test selftest
      - run: pyinstaller --noconfirm kadr.spec
      - name: Self-test of the built program
        run: QT_QPA_PLATFORM=offscreen KADR_LANG=uk dist/kadr/kadr --render-test selftest-built
      - name: .deb and .rpm installers
        run: bash ../installer/linux/build-packages.sh "${VERSION#v}"
      - name: Check the .deb installs and starts
        run: |
          sudo apt-get install -y ./Kadr-Linux-amd64.deb
          test -x /usr/bin/kadr && test -f /usr/share/applications/kadr.desktop && test -f /usr/share/icons/hicolor/256x256/apps/kadr.png
          QT_QPA_PLATFORM=offscreen KADR_LANG=en kadr --render-test selftest-installed
      - name: AppImage (no install, runs from anywhere)
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/kadr/* AppDir/usr/bin/
          cp ../icons/kadr-256.png AppDir/kadr.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/kadr" "$@"
          EOF
          chmod +x AppDir/AppRun
          cp pkgroot/usr/share/applications/kadr.desktop AppDir/kadr.desktop
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir Kadr-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Kadr-Linux
          path: |
            qt/Kadr-Linux-amd64.deb
            qt/Kadr-Linux-x86_64.rpm
            qt/Kadr-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: selftest-linux, path: "qt/selftest*" }

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: AppleSilicon }
          - { os: macos-15-intel, arch: Intel }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: qt } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller pillow
      - name: Self-test (draws the overlay, dialogs and notices)
        run: QT_QPA_PLATFORM=offscreen KADR_LANG=ru python -m kadr --render-test selftest
      - run: |
          sed -i '' "s/\"CFBundleShortVersionString\": \"1.0.0\"/\"CFBundleShortVersionString\": \"${VERSION#v}\"/" kadr.spec
          pyinstaller --noconfirm kadr.spec
      - name: Self-test of the built app
        run: QT_QPA_PLATFORM=offscreen KADR_LANG=en dist/Kadr.app/Contents/MacOS/Kadr --render-test selftest-built
      - name: Disk image with "drag to Applications"
        run: |
          codesign --force --deep --sign - dist/Kadr.app
          python tools/dmg_background.py
          tiffutil -cathidpicheck build/dmg-background.png build/dmg-background@2x.png -out build/dmg-background.tiff
          mkdir -p dmgsrc && cp -R dist/Kadr.app dmgsrc/
          DMG="Kadr-macOS-${{ matrix.arch }}.dmg"
          brew install create-dmg
          if ! create-dmg --volname "Kadr" --background build/dmg-background.tiff --window-pos 200 120 \
               --window-size 660 448 --icon-size 112 --icon "Kadr.app" 165 170 --hide-extension "Kadr.app" \
               --app-drop-link 495 170 "$DMG" dmgsrc/; then
            echo "create-dmg failed, plain image with an Applications link instead"
            rm -f "$DMG"
            ln -s /Applications dmgsrc/Applications
            hdiutil create -volname Kadr -srcfolder dmgsrc -ov -format UDZO "$DMG"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: "Kadr-macOS-${{ matrix.arch }}", path: "qt/Kadr-macOS-${{ matrix.arch }}.dmg" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "selftest-macos-${{ matrix.arch }}", path: "qt/selftest*" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the C# compiler that ships with Windows
        shell: powershell
        run: ./build.ps1
      - name: Installer (Inno Setup)
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = $env:VERSION.TrimStart("v")
          & $iscc "/DAppVersion=$ver" installer\windows\kadr.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check the installer installs and uninstalls silently
        shell: powershell
        run: |
          Start-Process dist\Kadr-Setup-Windows.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=sendto" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Kadr\Kadr.exe"
          if (-not (Test-Path $exe)) { Write-Error "not installed"; exit 1 }
          Get-Process Kadr -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process "$env:LOCALAPPDATA\Programs\Kadr\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Test-Path $exe) { Write-Error "not uninstalled"; exit 1 }
          "install + uninstall OK"
          Copy-Item dist\Kadr-Setup-Windows.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Kadr-Windows
          path: |
            Kadr-Setup-Windows.exe
            Kadr.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, mac, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "Kadr-*", merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Kadr-Setup-Windows.exe
            Kadr-macOS-*.dmg
            Kadr-Linux-amd64.deb
            Kadr-Linux-x86_64.rpm
            Kadr-Linux-x86_64.AppImage
            Kadr.exe
